services:
  ai-engineering-platform-db:
    image: pgvector/pgvector:pg16
    container_name: ai-engineering-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before docker compose up}
      POSTGRES_DB: ai-engineering-platform
    volumes:
      - ai-engineering-platform-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aep -d ai-engineering-platform"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"

  ai-engineering-platform-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-engineering-platform-app
    restart: unless-stopped
    depends_on:
      ai-engineering-platform-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://aep:${POSTGRES_PASSWORD}@ai-engineering-platform-db:5432/ai-engineering-platform
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production-use-a-long-random-value}
      APP_URL: http://127.0.0.1:43127
      NODE_ENV: production
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-[REDACTED]}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-minimax-m2.5}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-[REDACTED]}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      PORT: 43127
      HOSTNAME: 0.0.0.0
    ports:
      - "43127:43127"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:43127/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s

volumes:
  ai-engineering-platform-pgdata:
