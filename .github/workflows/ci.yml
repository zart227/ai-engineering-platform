name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  NODE_VERSION: "22"
  APP_PORT: "43127"
  POSTGRES_USER: aep
  POSTGRES_PASSWORD: ci-postgres-password-change-me
  POSTGRES_DB: ai-engineering-platform
  DATABASE_URL: postgresql://aep:ci-postgres-password-change-me@localhost:5432/ai-engineering-platform
  AUTH_SECRET: ci-auth-secret-use-a-long-random-value
  APP_URL: http://127.0.0.1:43127
  COOKIE_SECURE: "false"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aep
          POSTGRES_PASSWORD: ci-postgres-password-change-me
          POSTGRES_DB: ai-engineering-platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aep -d ai-engineering-platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        run: npm run test:e2e
        env:
          CI: "true"
          NODE_ENV: production
          PORT: ${{ env.APP_PORT }}
